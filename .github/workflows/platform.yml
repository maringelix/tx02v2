# Installs (or removes) the platform layer on the lab cluster: ALB Controller (Application Gateway
# for Containers), External Secrets Operator and platform/manifests. CLOUD-MUTATING: dispatch
# manually after terraform-apply. tx02v2-gha-apply must be in LAB_CLUSTER_ADMIN_PRINCIPAL_IDS
# (Azure Kubernetes Service RBAC Cluster Admin) and GitHub-hosted runners must reach the API server
# (LAB_API_SERVER_AUTHORIZED_IP_RANGES, docs/ARCHITECTURE.md). Not run in the cloud yet (v2).
name: platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: Lab runtime
        type: choice
        options: [primary, secondary]
        default: primary
      action:
        description: install or uninstall
        type: choice
        options:
          - install
          - uninstall
        default: install
      finops:
        description: Install configured OpenCost and recommendation-only VPA (full)
        type: boolean
        default: false
      profile:
        description: Core platform only, or the full platform including GitOps and observability
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

concurrency:
  group: tx02v2-lab-cloud
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets, not variables: the logs of a public repository are public, and a secret is masked.
      APP_DEPLOYER_PRINCIPAL_IDS: ${{ secrets.LAB_APP_DEPLOYER_PRINCIPAL_IDS || '[]' }}
      VELERO_REPOSITORY_PASSWORD: ${{ secrets.LAB_VELERO_REPOSITORY_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.LAB_SLACK_WEBHOOK_URL }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      TARGET: ${{ inputs.target }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: Check repository variables
        env:
          AZURE_APPLY_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          json_list='^\[.*\]$'
          problems=()
          for v in AZURE_APPLY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ "${!v}" =~ $guid ]] || problems+=("$v must be a lowercase GUID")
          done
          [[ "$APP_DEPLOYER_PRINCIPAL_IDS" =~ $json_list ]] || problems+=("LAB_APP_DEPLOYER_PRINCIPAL_IDS must be a JSON list, e.g. []")
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions (the lists of people and addresses are secrets, the rest variables); names and values in docs/RUNBOOK.md (section 'GitHub variables and secrets')."
            exit 1
          fi
          # Identifiers never reach the logs of a public repository.
          for v in AZURE_APPLY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            echo "::add-mask::${!v}"
          done
          echo "::add-mask::$(printf '%s' "$AZURE_SUBSCRIPTION_ID" | sha1sum | cut -c1-8)"

      - name: Mask the people of the operator in the logs
        run: |
          if [[ "$APP_DEPLOYER_PRINCIPAL_IDS" != "[]" ]]; then
            items="$(jq -r '.[]' <<<"$APP_DEPLOYER_PRINCIPAL_IDS")"
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              echo "::add-mask::$item"
            done <<<"$items"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubectl, helm and kubelogin (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kubectl helm kubelogin

      # Right before the script: the GitHub OIDC assertion behind azure/login lives 5-10 minutes,
      # and the script acquires every Azure token it needs in its first minutes.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run platform/${{ inputs.action }}.sh
        env:
          ACTION: ${{ inputs.action }}
          FINOPS: ${{ inputs.finops }}
          FINOPS_PRICING_JSON: ${{ vars.LAB_FINOPS_PRICING_JSON }}
        run: |
          args=()
          if [[ "$ACTION" == install && "$FINOPS" == true ]]; then
            umask 077
            printf '%s\n' "$FINOPS_PRICING_JSON" > "$RUNNER_TEMP/finops-pricing.json"
            export FINOPS_PRICING_FILE="$RUNNER_TEMP/finops-pricing.json"
            args+=(--finops)
          fi
          case "$ACTION" in
            install) bash platform/install.sh --profile "$PROFILE" --github-owner "$GITHUB_OWNER" --target "$TARGET" "${args[@]}" ;;
            uninstall) bash platform/uninstall.sh --target "$TARGET" ;;
            *) echo "::error::unknown action: $ACTION"; exit 1 ;;
          esac
