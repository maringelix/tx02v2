# Applies terraform/envs/lab. CLOUD-MUTATING and billable (Application Gateway for Containers with
# its WAF is the biggest item, docs/CUSTOS.md): dispatch manually, after reading the latest
# terraform-plan run. The `lab` environment (required reviewer, main only) gates the federated
# credential of tx02v2-gha-apply (subject repo:<owner>/tx02v2:environment:lab). Terraform logs in
# with OIDC through the ARM_* variables. Not run in the cloud yet (v2).
name: terraform-apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tx02v2-lab-cloud
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_location: ${{ vars.LAB_LOCATION }}
      TF_VAR_postgres_profile: ${{ vars.LAB_POSTGRES_PROFILE || 'core' }}
      TF_VAR_active_region: ${{ vars.LAB_ACTIVE_REGION || 'primary' }}
      TF_VAR_postgres_ha_sku: ${{ vars.LAB_POSTGRES_HA_SKU || 'GP_Standard_D2ads_v5' }}
      TF_VAR_postgres_backup_retention_days: ${{ vars.LAB_POSTGRES_BACKUP_RETENTION_DAYS || '7' }}
      TF_VAR_postgres_geo_backup: ${{ vars.LAB_POSTGRES_GEO_BACKUP || 'false' }}
      TF_VAR_postgres_delete_lock: ${{ vars.LAB_POSTGRES_DELETE_LOCK || 'false' }}
      TF_VAR_dr_location: ${{ vars.LAB_DR_LOCATION || 'centralus' }}
      TF_VAR_dr_vnet_cidr: ${{ vars.LAB_DR_VNET_CIDR || '10.21.0.0/16' }}
      TF_VAR_dr_aks_nodes_subnet_cidr: ${{ vars.LAB_DR_AKS_NODES_SUBNET_CIDR || '10.21.0.0/22' }}
      TF_VAR_dr_agc_subnet_cidr: ${{ vars.LAB_DR_AGC_SUBNET_CIDR || '10.21.4.0/24' }}
      TF_VAR_dr_postgres_subnet_cidr: ${{ vars.LAB_DR_POSTGRES_SUBNET_CIDR || '10.21.5.0/24' }}
      TF_VAR_dr_pod_cidr: ${{ vars.LAB_DR_POD_CIDR || '10.245.0.0/16' }}
      TF_VAR_dr_service_cidr: ${{ vars.LAB_DR_SERVICE_CIDR || '10.1.0.0/16' }}
      TF_VAR_dr_dns_service_ip: ${{ vars.LAB_DR_DNS_SERVICE_IP || '10.1.0.10' }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_deploy_principal_id: ${{ vars.LAB_DEPLOY_PRINCIPAL_ID }}
      # Secrets, not variables: the logs of a public repository are public, and a secret is masked.
      TF_VAR_cluster_admin_principal_ids: ${{ secrets.LAB_CLUSTER_ADMIN_PRINCIPAL_IDS }}
      TF_VAR_app_deployer_principal_ids: ${{ secrets.LAB_APP_DEPLOYER_PRINCIPAL_IDS || '[]' }}
      TF_VAR_api_server_authorized_ip_ranges: ${{ secrets.LAB_API_SERVER_AUTHORIZED_IP_RANGES }}
      TF_VAR_allow_api_server_from_anywhere: ${{ vars.LAB_ALLOW_API_SERVER_FROM_ANYWHERE || 'false' }}
      TF_VAR_enable_waf: ${{ vars.LAB_ENABLE_WAF || 'true' }}
      TF_VAR_dns_zone_name: ${{ vars.LAB_DNS_ZONE_NAME || '' }}
      TF_VAR_app_domain_name: ${{ vars.LAB_APP_DOMAIN_NAME || '' }}
      TF_VAR_acme_contact_email: ${{ vars.LAB_ACME_CONTACT_EMAIL || '' }}
      TF_VAR_node_vm_size: ${{ vars.LAB_NODE_VM_SIZE || 'Standard_D2als_v6' }}
      TF_VAR_node_count: ${{ vars.LAB_NODE_COUNT || '2' }}
    steps:
      - name: Check repository variables
        run: |
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          json_list='^\[.*\]$'
          problems=()
          # <environment variable>:<repository variable it comes from>
          for pair in ARM_CLIENT_ID:AZURE_APPLY_CLIENT_ID ARM_TENANT_ID:AZURE_TENANT_ID ARM_SUBSCRIPTION_ID:AZURE_SUBSCRIPTION_ID TF_VAR_deploy_principal_id:LAB_DEPLOY_PRINCIPAL_ID; do
            v="${pair%%:*}"
            [[ "${!v}" =~ $guid ]] || problems+=("${pair#*:} must be a lowercase GUID")
          done
          [[ "$TF_STATE_STORAGE_ACCOUNT" =~ ^tx02v2tfstate[0-9a-f]{8}$ ]] || problems+=("TF_STATE_STORAGE_ACCOUNT must be the bootstrap output state_storage_account_name")
          [[ "$TF_VAR_location" =~ ^[a-z][a-z0-9]{2,30}$ ]] || problems+=("LAB_LOCATION must be the location given to the bootstrap, e.g. eastus2")
          [[ "$TF_VAR_node_vm_size" =~ ^Standard_[A-Za-z0-9_]+$ && ! "$TF_VAR_node_vm_size" =~ ^Standard_B ]] || problems+=("LAB_NODE_VM_SIZE must be a non-B-series Azure VM size, e.g. Standard_D2as_v5")
          [[ "$TF_VAR_node_count" =~ ^[1-3]$ ]] || problems+=("LAB_NODE_COUNT must be an integer from 1 to 3")
          for pair in TF_VAR_cluster_admin_principal_ids:LAB_CLUSTER_ADMIN_PRINCIPAL_IDS TF_VAR_api_server_authorized_ip_ranges:LAB_API_SERVER_AUTHORIZED_IP_RANGES TF_VAR_app_deployer_principal_ids:LAB_APP_DEPLOYER_PRINCIPAL_IDS; do
            v="${pair%%:*}"
            [[ "${!v}" =~ $json_list ]] || problems+=("${pair#*:} must be a JSON list, e.g. [\"...\"]")
          done
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions (the lists of people and addresses are secrets, the rest variables); names and values in docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi
          # Identifiers never reach the logs of a public repository.
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_deploy_principal_id; do
            echo "::add-mask::${!v}"
          done
          echo "::add-mask::$(printf '%s' "$ARM_SUBSCRIPTION_ID" | sha1sum | cut -c1-8)"

      - name: Mask the addresses and the people of the operator in the logs
        env:
          API_RANGES: ${{ secrets.LAB_API_SERVER_AUTHORIZED_IP_RANGES }}
          ADMIN_IDS: ${{ secrets.LAB_CLUSTER_ADMIN_PRINCIPAL_IDS }}
          DEPLOYER_IDS: ${{ secrets.LAB_APP_DEPLOYER_PRINCIPAL_IDS }}
        run: |
          for list in "$API_RANGES" "$ADMIN_IDS" "$DEPLOYER_IDS"; do
            [[ -n "$list" ]] || continue
            items="$(jq -r '.[]' <<<"$list")"
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              echo "::add-mask::$item"
              echo "::add-mask::${item%%/*}"
            done <<<"$items"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install terraform (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: terraform init
        run: terraform -chdir=terraform/envs/lab init -input=false -lockfile=readonly -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"

      - name: terraform plan
        run: terraform -chdir=terraform/envs/lab plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform/envs/lab apply -input=false -no-color tfplan

      - name: Replicate current credentials to the standby vault
        if: env.TF_VAR_postgres_profile == 'dr'
        run: |
          host="$(terraform -chdir=terraform/envs/lab output -raw dr_postgres_fqdn)"
          bash scripts/sync-dr-secrets.sh --db-host "$host"

      - name: Outputs to the job summary (identifiers and addresses replaced)
        env:
          API_RANGES: ${{ secrets.LAB_API_SERVER_AUTHORIZED_IP_RANGES }}
        run: |
          suffix="$(printf '%s' "$ARM_SUBSCRIPTION_ID" | sha1sum | cut -c1-8)"
          text="$(terraform -chdir=terraform/envs/lab output -no-color |
            sed -E -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<GUID>/g' -e "s/$suffix/<SUFFIX>/g")"
          # The job summary is not covered by the masks of the log.
          while IFS= read -r cidr; do
            text="${text//"$cidr"/<CIDR>}"
            text="${text//"${cidr%%/*}"/<IP>}"
          done < <(jq -r '.[]' <<<"$API_RANGES")
          {
            echo "## terraform apply: terraform/envs/lab"
            echo '```'
            printf '%s\n' "$text"
            echo '```'
            echo "Next: dispatch the platform workflow (action=install), then the deploy-azure workflow of dx02v2. Destroy when done."
          } >> "$GITHUB_STEP_SUMMARY"
