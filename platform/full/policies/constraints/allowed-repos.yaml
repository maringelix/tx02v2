# The cloud twin of platform/local/policies/constraints/allowed-repos.yaml (same template, selector,
# and deny): app images must come from this fork's ACR repository. The local registry and local Istio
# gateways do not exist here. The renderer substitutes the contract ACR host.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: LabAllowedRepos
metadata:
  name: allowed-repos
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    namespaceSelector:
      matchLabels:
        policy.lab/enforce: "true"
    # cert-manager controls these short-lived pods; its pinned solver image is outside ACR.
    labelSelector:
      matchExpressions:
        - key: acme.cert-manager.io/http01-solver
          operator: DoesNotExist
  parameters:
    repos:
      - "__ACR_LOGIN_SERVER__/dx02v2/"
