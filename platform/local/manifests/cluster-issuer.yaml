# ClusterIssuer lab-ca: signs the Gateway certificates with the lab CA of terraform/envs/local (the
# stand-in for the full profile's public ACME certificate on AGC). install.sh creates the Secret
# lab-ca (tls.crt/tls.key) in cert-manager first.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
