# Local overrides on top of platform/values/external-secrets.yaml (same chart, images and digests as
# the cloud platform). No Workload ID here: the pod label azure.workload.identity/use of the cloud
# values stays, but kind runs no Workload ID webhook, so nothing is injected; the ClusterSecretStore
# local-secrets authenticates with the token of a service account (platform/local/manifests/secret-store.yaml).
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 256Mi
