# ClusterSecretStore of contract v1: Azure Key Vault through Microsoft Entra Workload ID. ESO
# requests a token for the referenced ServiceAccount (annotated with the client ID of
# tx02v2-lab-eso, Key Vault Secrets User on the lab vault only). platform/render-manifests.sh
# puts the contract key keyvault/uri into vaultUrl. Usable from dx02v2 only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  conditions:
    - namespaces:
        - dx02v2
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: __KEYVAULT_URI__
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
