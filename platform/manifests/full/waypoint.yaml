# L7 waypoint for the application namespace in the cloud full profile. The core profile uses ambient
# L4 mTLS only; this profile routes in-mesh service traffic through this waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dx02v2-waypoint
  namespace: dx02v2
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
