# Static values of the external-secrets chart (namespace external-secrets). platform/install.sh
# adds the Workload ID annotations of the ServiceAccount (client ID of tx02v2-lab-eso and the
# tenant ID) with --set-string.
installCRDs: true

image:
  # v2.12.0, pinned by digest (verified 2026-10-10 for tx01v2, same release). The same image
  # runs the webhook and the cert controller.
  tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d

serviceAccount:
  create: true
  # Federated credential of tx02v2-lab-eso: system:serviceaccount:external-secrets:external-secrets.
  name: external-secrets

# Contract: the controller pods carry the Workload ID label (the AKS webhook injects the token).
podLabels:
  azure.workload.identity/use: "true"

webhook:
  image:
    tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d

certController:
  image:
    tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
