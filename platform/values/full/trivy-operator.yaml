# Overlay of platform/local/values/trivy-operator.yaml for the cloud full profile. Azure Workload ID
# gives scanner jobs short-lived ACR access through the trivy-operator service account; Terraform
# scopes that identity to dx02v2/api and dx02v2/web only.
serviceAccount:
  name: trivy-operator
  annotations:
    azure.workload.identity/client-id: __TRIVY_CLIENT_ID__

trivyOperator:
  scanJobAutomountServiceAccountToken: true
  scanJobPodTemplateLabels: azure.workload.identity/use=true

trivy:
  registry:
    mirror: null
  nonSslRegistries: null
